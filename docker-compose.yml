services:
  postgres:
    image: postgres:16-alpine
    container_name: apparent-currents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: apparent_currents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - apparent-currents-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d apparent_currents']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apparent-currents-postgres-data:
