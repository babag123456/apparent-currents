services:
  postgres:
    image: postgres:16-alpine
    container_name: award-kit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: award_kit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - award-kit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d award_kit']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  award-kit-postgres-data:
